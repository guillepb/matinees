# Configuración de Matinées BCN

timezone: Europe/Madrid

# Filtro de matinée (se aplica en build.py, no en el scraping)
matinee:
  cutoff: "13:00"            # hora de corte inclusiva: entra una sesión que empiece a esta hora
  weekdays: [0, 1, 2, 3, 4]  # 0 = lunes ... 6 = domingo
  horizon_days: 14           # días vista desde hoy (incluido); cada fuente llega hasta donde tenga datos

# Cines que se scrapean a diario.
#   id:          clave estable (se usa en cinema_id)
#   name:        nombre visible
#   source:      módulo en scraper/sources/ (zumzeig | publicine | filmagenda)
#   url:         página de cartelera que lee el módulo
#   tickets_url: enlace genérico de entradas si la sesión no trae uno propio
cinemas:
  - id: zumzeig
    name: Zumzeig
    source: zumzeig
    url: https://zumzeigcine.coop/es/cine/calendari/
    tickets_url: https://zumzeigcine.coop/es/cine/sesiones/

  - id: verdi-barcelona
    name: Verdi Barcelona
    source: filmagenda
    url: https://www.filmagenda.es/cine/verdi-barcelona
    tickets_url: https://barcelona.cines-verdi.com/cartelera

  - id: verdi-park
    name: Verdi Park
    source: filmagenda
    url: https://www.filmagenda.es/cine/verdi-park
    tickets_url: https://barcelona.cines-verdi.com/cartelera

  - id: kinepolis-splau
    name: Kinépolis Splau
    source: publicine
    url: https://www.publicine.net/cartelera-cine/cornella-de-llobregat/kinepolis-barcelona-full-splau
    tickets_url: https://kinepolis.es/?complex=PFULL

  - id: cinemes-girona
    name: Cinemes Girona
    source: filmagenda
    url: https://www.filmagenda.es/cine/cinemes-girona
    tickets_url: https://www.cinemesgirona.cat/cartelera

  - id: cinema-malda
    name: Cinema Maldà
    source: filmagenda
    url: https://www.filmagenda.es/cine/cinema-malda
    tickets_url: https://www.cinemamalda.com/

  - id: caixaforum
    name: CaixaForum
    source: filmagenda
    url: https://www.filmagenda.es/cine/caixaforum-barcelona
    tickets_url: https://caixaforum.org/es/barcelona

